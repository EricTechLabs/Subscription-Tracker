// Show loading failures instead of leaving an empty application shell.
function showStartupError(message){if(window.__trackerStarted)return;const content=document.getElementById('content');if(!content)return;content.replaceChildren();const box=document.createElement('div');box.className='empty';const heading=document.createElement('h2');heading.textContent='網站程式尚未載入完成';const detail=document.createElement('p');detail.className='hint';detail.textContent=message||'請重新整理頁面再試一次。';const button=document.createElement('button');button.className='primary';button.textContent='重新載入';button.onclick=()=>{const url=new URL(location.href);url.searchParams.set('reload',Date.now());location.replace(url.href);};box.append(heading,detail,button);content.append(box);}
window.showTrackerStartupError=showStartupError;
window.addEventListener('error',event=>{if(event.error||event.message)showStartupError(event.message||event.error?.message);});
window.addEventListener('unhandledrejection',event=>showStartupError(event.reason?.message||String(event.reason||'程式載入失敗')));
window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{if(!window.__trackerStarted)showStartupError('載入時間較長，可能是網路或舊版檔案快取造成。請重新載入。');},12000);});

async function save(row){if(busy)throw Error('正在儲存，請稍候');busy=true;try{if(mode==='cloud'){const {data,error}=await client.from('st_subscriptions').upsert({...row,user_id:session.user.id}).select().single();if(error)throw error;row=data;}const idx=items.findIndex(s=>s.id===row.id);if(idx<0)items.push(row);else items[idx]=row;persist();if(selected)selected=row;render();}finally{busy=false;}}
function range(){if(period==='custom')return [customFrom,customTo];if(period==='year')return [anchor.slice(0,4)+'-01-01',anchor.slice(0,4)+'-12-31'];return monthRange();}
function paymentChart(buckets){const largest=Math.max(0,...buckets.map(b=>b.value));const reference=largest||10000;const quantum=Math.max(1,10**(Math.floor(Math.log10(reference))-1));const top=Math.max(4,Math.ceil(Math.ceil(reference/quantum)*quantum/4)*4);const ticks=Array.from({length:5},(_,i)=>i*top/4);return `<div class="payment-chart" role="img" aria-label="${esc('付款分布：'+buckets.map(b=>b.label+' '+money(b.value)).join('，'))}" data-axis-max="${top}"><div class="chart-frame"><div class="chart-plot"><div class="chart-grid" aria-hidden="true">${ticks.map(v=>`<span class="chart-gridline" style="top:${100-v/top*100}%"></span>`).join('')}</div><div class="chart-columns">${buckets.map(b=>`<div class="chart-slot" title="${esc(b.label+' '+money(b.value))}"><div class="bar" style="height:${b.value/top*100}%"></div></div>`).join('')}</div></div><div class="chart-y-axis" aria-hidden="true">${ticks.map(v=>`<span class="chart-tick" style="top:${100-v/top*100}%">${money(v)}</span>`).join('')}</div><div class="chart-x-labels" aria-hidden="true">${buckets.map(b=>`<span class="bar-label">${b.label}</span>`).join('')}</div></div></div>`;}
function analysisControls(){const [year,month]=anchor.split('-').map(Number);const title=period==='month'?`${year}年${month}月`:period==='year'?`${year}年`:'自定義期間';const before=period==='year'?year<=1900:anchor<='1900-01',after=period==='year'?year>=2100:anchor>='2100-12';return `<div class="analysis-periodbar"><span aria-hidden="true"></span><h1 id="periodTitle">${title}</h1>${period==='custom'?'<span aria-hidden="true"></span>':`<div class="period-arrows"><button id="prev" aria-label="上一${period==='month'?'月':'年'}" ${before?'disabled':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><button id="next" aria-label="下一${period==='month'?'月':'年'}" ${after?'disabled':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button></div>`}</div><div class="analysis-segmented" role="group" aria-label="分析期間">${[['month','月'],['year','年'],['custom','自定義']].map(([value,label])=>`<button type="button" data-period="${value}" aria-pressed="${period===value}">${label}</button>`).join('')}</div>${period==='custom'?`<div class="custom-period-range"><label class="field">開始日期<input id="from" type="date" min="1900-01-01" max="2100-12-31" value="${customFrom}"></label><label class="field">結束日期<input id="to" type="date" min="1900-01-01" max="2100-12-31" value="${customTo}"></label></div><p id="customRangeError" class="error custom-range-error" role="alert"></p>`:''}`;}
function analysis(){analysisDetailOpen=false;const [from,to]=range(),active=items,report=paymentReport(active,from,to,period==='year'?'month':'day'),total=report.total,count=report.count;let buckets=[];if(period==='year'){for(let m=1;m<=12;m++){const ym=anchor.slice(0,4)+'-'+String(m).padStart(2,'0');const [f,t]=monthRange(ym);buckets.push({label:m+'月',value:sum(active,f,t)});}}else{const n=daysBetween(from,to)+1,step=Math.max(1,Math.ceil(n/12));for(let i=0;i<n;i+=step){const f=iso(new Date(+parseDate(from)+i*DAY)),t=iso(new Date(Math.min(+parseDate(to),+parseDate(f)+(step-1)*DAY)));buckets.push({label:n<=31?Number(f.slice(8))+'日':f.slice(5),value:sum(active,f,t)});}}const cats=categories().map((c,i)=>({name:c,value:sum(active.filter(s=>s.category===c),from,to),color:color({category:c})})).filter(c=>c.value).sort((a,b)=>b.value-a.value);let stop=0;const gradient=cats.map(c=>{const start=stop;stop+=100*c.value/total;return `${c.color} ${start}% ${stop}%`;}).join(',');$('#content').innerHTML=analysisControls()+`<div class="summary"><div class="metric"><div class="metric-label">期間排程支出</div><div class="metric-value">${money(total)}</div><div class="metric-note">${from} — ${to}</div></div><button type="button" class="metric metric-link" id="paymentCount" aria-label="查看 ${count} 筆付款明細"><span class="metric-label">付款筆數<span class="metric-chevron" aria-hidden="true">›</span></span><span class="metric-value">${count}<small> 筆</small></span><span class="metric-note">查看期間付款明細</span></button><div class="metric"><div class="metric-label">${period==='year'?'每月平均':'每日平均'}</div><div class="metric-value">${report.average===null?'—':money(report.average)}</div><div class="metric-note average-note">${report.denominator?`${report.start.replace(/-/g,'/')} 起，共 ${report.denominator} ${period==='year'?'個月':'天'}；含未來預估`:'期間內尚無記錄'}</div></div></div><div class="grid-two"><div class="panel"><h2>付款分布</h2>${paymentChart(buckets)}<p class="hint">此圖顯示排程金額，未串接銀行或信用卡。</p></div><div class="panel"><h2>類別占比</h2><div class="donut" style="background:${total?'conic-gradient('+gradient+')':'#35323c'}"><div class="donut-center"><small>合計</small>${money(total)}</div></div>${cats.map(c=>`<div class="legend-row"><span><span class="dot" style="--tint:${c.color}"></span>${esc(c.name)}</span><span><small>${(c.value/total*100).toFixed(1)}%　</small>${money(c.value)}</span></div>`).join('')||'<p class="hint">這段期間沒有排定付款。</p>'}</div></div><p class="hint">已結束的項目仍保留期間內的付款紀錄。</p>`;$('#paymentCount').onclick=()=>{analysisDetailOpen=true;render();window.scrollTo(0,0);};document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;analysis();});if(period==='custom'){const update=()=>{try{const f=$('#from').value,t=$('#to').value;if(!f||!t)throw Error('請選擇開始與結束日期');parseDate(f);parseDate(t);if(f>t)throw Error('開始日期不能晚於結束日期');if(f<'1900-01-01'||t>'2100-12-31')throw Error('請選擇 1900～2100 年間的日期');if(daysBetween(f,t)>3660)throw Error('日期範圍最多十年');customFrom=f;customTo=t;analysis();}catch(error){$('#customRangeError').textContent=error.message;}};$('#from').onchange=update;$('#to').onchange=update;}else{const shift=n=>{const [y,m]=anchor.split('-').map(Number);const next=iso(new Date(Date.UTC(y+(period==='year'?n:0),m-1+(period==='month'?n:0),1))).slice(0,7);if(next<'1900-01'||next>'2100-12')return;anchor=next;analysis();};$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);}}

function paymentDetails(){const [from,to]=range();const report=paymentReport(items,from,to,period==='year'?'month':'day');const groups=new Map();for(const entry of report.entries){const month=entry.date.slice(0,7);if(!groups.has(month))groups.set(month,[]);groups.get(month).push(entry);}$('#content').innerHTML=`<div class="payment-detail-toolbar"><button type="button" id="paymentsBack" class="round-button" aria-label="返回支出分析"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><div><h1>付款明細</h1><p>${from.replace(/-/g,'/')} — ${to.replace(/-/g,'/')}</p></div></div><div class="payment-detail-summary"><span>${report.count} 筆排程付款</span><strong>${money(report.total)}</strong></div><p class="hint">依付款排程展開，包含未來預計付款。</p>${[...groups.keys()].sort().reverse().map(month=>{const entries=groups.get(month),[y,m]=month.split('-');return `<section class="payment-month" data-month="${month}"><div class="payment-month-heading"><h2>${y}年${Number(m)}月</h2><strong>${money(entries.reduce((n,e)=>n+e.amount_cents,0))}</strong></div><div class="payment-entries">${entries.map(entry=>`<div class="payment-entry" data-date="${entry.date}" data-amount="${entry.amount_cents}"><time datetime="${entry.date}">${entry.date.replace(/-/g,'/')}</time><span>${esc(entry.name)}</span><strong>${money(entry.amount_cents)}</strong></div>`).join('')}</div></section>`;}).join('')||'<div class="empty">這段期間沒有排定付款。</div>'}`;$('#paymentsBack').onclick=()=>{analysisDetailOpen=false;render();window.scrollTo(0,0);};}
function settings(){$('#content').innerHTML='<div class="title-row settings-title"><h1>設定</h1></div>'+`<div class="grid-two"><section><div class="panel"><h2>帳號與資料</h2><button class="settings-button" id="account"><span>帳戶<small>${mode==='cloud'?esc(session.user.email):'示範帳戶預覽'}</small></span><span>↗</span></button><button class="settings-button" id="refresh"><span>重新整理雲端資料<small>其他裝置的修改會在重新載入或回到網站時更新</small></span><span>↻</span></button>${mode==='cloud'?'<button class="settings-button" id="logout"><span>登出此裝置</span><span>→</span></button>':'<button class="settings-button" id="showLogin"><span>返回登入畫面</span><span>→</span></button>'}</div><div class="panel"><h2>類別管理</h2><p class="hint">類別集中在首頁左上角菜單選擇，可自行新增、修改或刪除。</p><button class="settings-button" id="settingsCategories"><span>管理我的類別</span><span>→</span></button></div></section><section><div class="panel"><h2>此裝置通知</h2><p>每筆的提前天數與時間，請到項目編輯畫面設定。</p><p class="hint" id="pushStatus">${mode==='demo'?'示範模式不會發送背景通知。':!config.vapidPublicKey?'後端推播尚未設定完成。':'授權僅適用於目前裝置；手機及電腦需分別開啟。'}</p><div class="actions"><button id="enablePush" class="primary">開啟此裝置通知</button><button id="disablePush">關閉此裝置推播</button></div></div><div class="panel"><h2>加入手機主畫面</h2><p>在 iPhone 用 Safari 開啟網站，點分享，再選「加入主畫面」。從主畫面開啟後，即可申請通知權限。</p><p class="hint">通知時間以 Asia/Taipei 計算；傳送與顯示可能因網路、系統或專注模式而延後。</p></div></section></div>`;$('#account').onclick=account;$('#refresh').onclick=async()=>{if(mode!=='cloud'){toast('目前為示範模式，請登入後使用雲端資料');return;}try{await loadCloud();toast('已更新雲端資料');}catch(e){toast(e.message);}};$('#enablePush').onclick=enablePush;$('#disablePush').onclick=disablePush;if($('#logout'))$('#logout').onclick=async()=>{try{await signOutAccount();}catch(error){toast('登出失敗，請稍後再試。');}};$('#settingsCategories').onclick=categoryManager;if($('#showLogin'))$('#showLogin').onclick=()=>{mode='welcome';items=[];selected=null;render();};}
function categoryManager(){openModal(`<div class="dialog-heading"><h2>管理類別</h2><button class="close" aria-label="關閉">×</button></div><div class="menu-group">${catalog.map(c=>`<div class="category-management-row"><button class="menu-entry" data-edit-category="${esc(c.name)}"><i class="category-square" style="background:${c.color}"></i><span>${esc(c.name)}</span><span class="menu-count">修改</span></button><button class="delete-category" data-delete-category="${esc(c.name)}" aria-label="刪除${esc(c.name)}">−</button></div>`).join('')}</div><button id="newCategory" class="primary" style="margin-top:20px;width:100%">＋ 新增類別</button>`);$('#newCategory').onclick=()=>categoryDialog(null,{returnToManager:true});document.querySelectorAll('[data-edit-category]').forEach(b=>b.onclick=()=>categoryDialog(b.dataset.editCategory,{returnToManager:true}));document.querySelectorAll('[data-delete-category]').forEach(b=>b.onclick=()=>deleteCategory(b.dataset.deleteCategory));}
function categoryDialog(old=null,{returnToManager=false}={}){const c=catalog.find(c=>c.name===old);openModal(`<div class="dialog-heading"><h2>${old?'修改類別':'新增類別'}</h2><button class="close" aria-label="關閉">×</button></div><form id="categoryForm"><label class="field">類別名稱<input name="category_name" value="${esc(c?.name||'')}" maxlength="30" placeholder="例如 保險、學習、交通" required></label><label class="field" style="display:block;margin-top:18px">類別顏色<input name="category_color" type="color" value="${c?.color||palette[catalog.length%palette.length]}"></label><p class="error" id="categoryError" role="alert"></p><div class="form-actions"><button type="button" class="close">取消</button><button class="primary" type="submit">儲存類別</button></div></form>`);if(returnToManager){$('#modalContent').querySelectorAll('.close').forEach(b=>b.onclick=categoryManager);$('#modal').oncancel=e=>{e.preventDefault();categoryManager();};}$('#categoryForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('[type=submit]');b.disabled=true;try{await writeCategory(old,e.target.category_name.value.trim(),e.target.category_color.value);render();if(returnToManager)categoryManager();else $('#modal').close();toast(old?'已更新類別':'已新增類別');}catch(err){$('#categoryError').textContent=err.message;}finally{b.disabled=false;}};}
async function writeCategory(old,name,tint){if(!name||name.length>30)throw Error('類別名稱需為 1～30 字');if(!/^#[0-9a-f]{6}$/i.test(tint))throw Error('請選擇有效顏色');if(catalog.some(c=>c.name===name&&c.name!==old))throw Error('已有相同名稱的類別');if(mode==='cloud'){const {error}=await client.rpc('st_save_category',{old_name:old,new_name:name,new_color:tint});if(error)throw error;}if(old){catalog=catalog.map(c=>c.name===old?{name,color:tint}:c);items=items.map(s=>s.category===old?{...s,category:name}:s);if(filter==='category:'+old)filter='category:'+name;}else catalog.push({name,color:tint});persistCatalog();persist();}
function deleteCategory(name){const count=items.filter(s=>s.category===name).length;const body=count?`此類別有 ${count} 筆項目。刪除類別後，項目會移到「未分類」，付款紀錄會保留。`:'這個類別沒有項目，刪除後可重新新增。';if(name==='未分類'&&count){toast('請先將未分類的項目移到其他類別，再刪除此類別');return;}confirmDialog('刪除「'+name+'」類別？',body,async()=>{if(mode==='cloud'){const {error}=await client.rpc('st_delete_category',{category_name:name});if(error)throw error;}if(count&&!catalog.some(c=>c.name==='未分類'))catalog.push({name:'未分類',color:'#96959f'});items=items.map(s=>s.category===name?{...s,category:'未分類'}:s);catalog=catalog.filter(c=>c.name!==name);if(filter==='category:'+name)filter='全部';persistCatalog();persist();render();toast('已刪除類別，項目保留');});}
async function sdk(){if(!window.supabase)throw Error('登入套件尚未載入完成，請重新整理。');}
function authConfigured(){return /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(config.supabaseUrl)&&!!config.publishableKey;}
async function initClient(){if(!authConfigured())throw {userMessage:'登入服務尚未啟用，請稍後再試。'};if(config.publishableKey.startsWith('sb_secret_'))throw {userMessage:'登入服務設定異常，請聯絡管理者。'};if(config.publishableKey.startsWith('eyJ')){try{const data=JSON.parse(atob(config.publishableKey.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(data.role!=='anon')throw Error();}catch{throw {userMessage:'登入服務設定異常，請聯絡管理者。'};}}await sdk();if(client)return;client=window.supabase.createClient(config.supabaseUrl,config.publishableKey,{auth:{storageKey:'subscription-auth-'+new URL(config.supabaseUrl).hostname}});client.auth.onAuthStateChange((event,nextSession)=>{session=nextSession;if(event==='SIGNED_OUT'&&mode==='cloud'){accountProfile=null;items=[];catalog=[];selected=null;mode='welcome';if($('#modal').open)$('#modal').close();render();}});}
async function loadCloud(){const {data:{session:nextSession},error:authError}=await client.auth.getSession();if(authError)throw authError;if(!nextSession)throw {userMessage:'請先登入。'};const [subscriptions,categoriesResult,profileResult]=await Promise.all([client.from('st_subscriptions').select('*').order('created_at'),client.from('st_categories').select('name,color').order('created_at'),client.from('st_profiles').select('username').eq('user_id',nextSession.user.id).maybeSingle()]);const error=subscriptions.error||categoriesResult.error||profileResult.error;if(error)throw {userMessage:'帳戶資料暫時無法讀取，請稍後重新登入。',cause:error};if(!profileResult.data)throw {userMessage:'帳戶資料尚未建立，請聯絡管理者。'};session=nextSession;items=subscriptions.data;catalog=categoriesResult.data;accountProfile=profileResult.data;mode='cloud';for(const item of items)if(!catalog.some(c=>c.name===item.category))catalog.push({name:item.category,color:'#96959f'});persistCatalog();selected=pendingSubscription?items.find(i=>i.id===pendingSubscription)||null:null;pendingSubscription=null;render();}
async function signOutAccount(){if(client){const {error}=await client.auth.signOut({scope:'local'});if(error)throw error;}session=null;accountProfile=null;items=[];catalog=[];selected=null;page='list';filter='全部';search='';mode='welcome';if($('#modal').open)$('#modal').close();render();}
const authViews=createAuthUI({escape:esc,brand:()=>$('#homeBrand .brand-logo').outerHTML.replace('home-brand-logo','auth-brand-logo'),configured:authConfigured,enterDemo,state:()=>({demo:mode==='demo',email:session?.user.email||'',username:accountProfile?.username||''}),openModal,signIn:async(email,password)=>{await initClient();const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;page='list';filter='全部';search='';menuOpen=false;analysisDetailOpen=false;await loadCloud();},signUp:async({username,email,password})=>{await initClient();const {error}=await client.auth.signUp({email,password,options:{data:{username}}});if(error)throw error;const {error:signOutError}=await client.auth.signOut({scope:'local'});if(signOutError)throw signOutError;},saveUsername:async username=>{const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user)throw {userMessage:'登入已失效，請重新登入。'};const {data,error}=await client.from('st_profiles').update({username}).eq('user_id',user.id).select('username').single();if(error)throw error;accountProfile=data;$('#accountButton').textContent=username.slice(0,1).toUpperCase();},changePassword:async(oldPassword,newPassword)=>{const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user?.email)throw {userMessage:'登入已失效，請重新登入。'};const {error:verifyError}=await client.auth.signInWithPassword({email:user.email,password:oldPassword});if(verifyError)throw {userMessage:'舊密碼不正確，無法修改密碼。'};const {error}=await client.auth.updateUser({password:newPassword,current_password:oldPassword});if(error)throw error;},signOut:signOutAccount});
function account(){if(mode==='welcome')return;authViews.account();}
function urlBytes(s){return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));}
async function enablePush(){try{if(mode!=='cloud')throw Error('示範模式不能發送推播，請登入後再開啟通知');if(!config.vapidPublicKey)throw Error('請先部署推播後端並填入 Web Push 公開金鑰');if(!('PushManager'in window)||!('Notification'in window))throw Error('此環境不支援推播。iPhone 請先加入主畫面，並從主畫面開啟。');const granted=await Notification.requestPermission();if(granted!=='granted')throw Error('尚未取得通知權限，請至系統設定允許通知');const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBytes(config.vapidPublicKey)});const json=sub.toJSON();const {error}=await client.from('st_push_devices').upsert({user_id:session.user.id,endpoint:json.endpoint,subscription:json},{onConflict:'user_id,endpoint'});if(error)throw error;$('#pushStatus').textContent='此裝置已登記推播。需確認後端排程啟用後，才能收到付款提醒。';toast('已開啟此裝置通知');}catch(e){toast(e.message);}}
async function disablePush(){try{if(!('serviceWorker'in navigator)||mode!=='cloud')throw Error('目前沒有可停用的雲端推播');const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub){const {error}=await client.from('st_push_devices').delete().eq('endpoint',sub.endpoint);if(error)throw error;await sub.unsubscribe();}toast('此裝置已停止推播');}catch(e){toast(e.message);}}
$('#accountButton').onclick=account;window.addEventListener('focus',()=>{if(mode==='cloud'&&!$('#modal').open&&!busy)loadCloud().catch(e=>toast(e.message));});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')render();});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=31',{updateViaCache:'none'}).catch(()=>toast('主畫面離線功能未能啟用'));
if(new URLSearchParams(location.search).get('demo')==='1'){mode='demo';items=JSON.parse(localStorage.getItem(storageKey)||'null')||demoData();items=items.map(({archived,...s})=>s);restoreCatalog();}
render();window.__trackerStarted=true;if(mode!=='demo'&&authConfigured()){try{await initClient();const {data:{session:existingSession}}=await client.auth.getSession();if(existingSession)await loadCloud();}catch(error){const output=$('#authMessage');if(output){output.textContent=error.userMessage||'暫時無法讀取登入狀態，請稍後再試。';output.className='auth-message err';}}}

document.addEventListener('error',event=>{const img=event.target;if(img.tagName==='IMG'&&img.closest('.service-icon')){const parent=img.parentElement;parent.textContent='▤';parent.title='圖示暫時無法載入';}},true);

})().catch(error=>{console.error(error);window.showTrackerStartupError(error?.message||'主程式載入失敗');});
</script></body></html>
